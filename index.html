.workspace{display:grid;grid-template-columns:minmax(0,1fr) 338px;height:calc(100dvh - 223px);min-height:530px}.mapwrap{position:relative;min-width:0;overflow:hidden}.viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;background-image:radial-gradient(var(--dot) .8px,transparent .8px);background-size:22px 22px;cursor:grab}.viewport.dragging{cursor:grabbing}.world{position:absolute;left:0;top:0;transform-origin:0 0;width:1px;height:1px}.wires{position:absolute;overflow:visible;pointer-events:none}.node{position:absolute;border:1px solid var(--line);background:var(--node);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;padding:13px 16px;text-align:left;color:var(--text);user-select:none}.node.selected{outline:2px solid var(--brand);outline-offset:3px}.node.hit{background:var(--soft)}.node.root{background:var(--header);color:#f4fbff;border:0;border-radius:24px;padding:24px;box-shadow:0 12px 45px #12324325}.root .node-title{font-size:25px;line-height:1.4}.root .node-sub{color:#b8d9e4;margin-top:10px;font-size:12px;line-height:1.8}.node-title{font-weight:600;font-size:15px;line-height:1.4}.node-sub{font-size:11px;color:var(--muted);line-height:1.8;margin-top:6px}.node.branch{border-left:4px solid var(--branch)}.branch .node-code{font-size:10px;color:var(--branch);letter-spacing:1px;display:block;margin-bottom:4px}.node.topic .node-title{font-size:13px;font-weight:500}.node.leaf{box-shadow:none;border-radius:8px;padding:9px 12px}.node.leaf .node-title{font-size:12px;font-weight:400}.node-main{border:0;background:none;color:inherit;padding:0;text-align:inherit;width:100%;cursor:pointer;display:block}.node-main:hover{background:none}.toggle{position:absolute;width:26px;height:26px;padding:0;right:-14px;top:calc(50% - 13px);border-radius:50%;font-size:17px;line-height:22px;background:var(--surface);color:var(--brand);z-index:1}.node.left .toggle{right:auto;left:-14px}.map-label{position:absolute;top:18px;left:22px;font-size:11px;letter-spacing:2px;color:var(--muted);pointer-events:none}.map-help{position:absolute;bottom:18px;left:20px;right:20px;display:flex;justify-content:space-between;gap:12px;pointer-events:none;color:var(--muted);font-size:11px;line-height:1.7}.map-help span{background:var(--bg);padding:4px 8px;border-radius:5px}.sidebar{background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;padding:23px 24px;scrollbar-width:thin}.detail-kicker{font-size:11px;letter-spacing:1.5px;color:var(--brand);margin-bottom:9px}.sidebar h2{font-size:22px;line-height:1.5;margin:0 0 12px;font-weight:600}.sidebar p{font-size:13px;line-height:1.85;color:var(--muted);margin:0 0 18px}.sidebar h3{font-size:13px;margin:23px 0 10px;font-weight:600}.sidebar ul{margin:0;padding:0 0 0 18px;font-size:13px;line-height:1.9;color:var(--muted)}.detail-item{border:0;border-bottom:1px solid var(--line);border-radius:0;display:block;width:100%;text-align:left;padding:12px 0;background:none}.detail-item:last-child{border-bottom:0}.detail-item strong{font-weight:500;font-size:13px;display:block}.detail-item span{display:block;font-size:11px;color:var(--muted);line-height:1.7;margin-top:4px}.formula{background:var(--soft);border-radius:8px;padding:13px 14px;font-size:13px;line-height:1.85;white-space:pre-wrap;font-family:"Cambria Math","Segoe UI",sans-serif}.formula-note{font-size:11px;line-height:1.8;color:var(--muted);margin-top:8px}.crosslink{font-size:12px;margin:3px 4px 3px 0;padding:6px 9px}.route{border-left:2px solid var(--line);padding-left:16px;margin:18px 0}.route div{position:relative;font-size:12px;line-height:1.8;margin-bottom:14px}.route div:before{content:"";position:absolute;left:-21px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--brand)}.route strong{display:block;font-weight:600}.route span{color:var(--muted)}footer{height:42px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:11px;color:var(- <body>
<header><div><div class="eyebrow">PHYSICAL OCEANOGRAPHY / KNOWLEDGE ATLAS</div><h1>物理海洋学 · 整体架构</h1><p>从海水的物理性质出发，理解海洋的运动、能量传递与气候作用。</p></div><div class="header-right"><strong>连接尺度，连接过程。</strong>风与浮力驱动 → 波动与环流响应<br>涡旋与湍流传递 → 混合与气候反馈</div></header>
<nav class="toolbar" aria-label="脑图工具"><div class="toolbar-group"><button id="overview" class="active">主干总览</button><button id="level2">二级全景</button><button id="fit">适应画布</button></div><span class="divider"></span><div class="toolbar-group"><button id="zoomout" class="smallbtn" aria-label="缩小">−</button><span id="zoomlabel" class="zoom-label">100%</span><button id="zoomin" class="smallbtn" aria-label="放大">＋</button></div><div class="toolbar-group"><button id="study">学习路线</button><button id="panel" aria-pressed="true">说明面板</button><button id="theme" aria-label="切换深浅主题">深色</button></div><form class="searchbox" id="searchform" role="search"><input id="search" type="search" placeholder="搜索：地转 / 混合 / ENSO…" aria-label="搜索知识节点"><button type="submit">查找</button></form></nav>
<main class="workspace" id="workspace"><section class="mapwrap" aria-label="可交互知识脑图"><div class="viewport" id="viewport"><div class="world" id="world"><svg class="wires" id="wires" width="1" height="1" aria-hidden="true"></svg><div id="nodes"></div></div></div><div class="map-label">THE OCEAN AS A PHYSICAL SYSTEM</div><div class="map-help"><span>拖动画布 · 滚轮缩放 · 点击节点查看 · ＋ 展开分支</span><span>从主干到概念，逐层探索</span></div></section><aside class="sidebar" id="sidebar" aria-label="节点说明"><div id="detail"></div></aside></main>

<script>
'use strict';
// Each topic holds concepts, an explanation, optional equations and cross-process links.
const branches=[
{id:'properties',name:'海水性质与海洋结构',en:'PROPERTIES & STRUCTURE',color:'#087b91',summary:'温盐密度 · 层结 · 水团 · 地形尺度',intro:'确定海洋的状态变量与空间结构：温度、盐度、压力共同决定密度；密度分布控制层结、压力梯度与运动。',topics:[
{name:'状态变量与海水热力学',desc:'海水密度不是温度的单变量函数。现代热力学框架 TEOS-10 使用绝对盐度和保守温度，有助于一致地计算密度、焓和浮力。',items:['温度、盐度、压力与密度','TEOS-10：绝对盐度 SA、保守温度 Θ','热膨胀、盐收缩与非线性状态方程'],formula:'ρ = ρ(SA, Θ, p)\nb = −g(ρ − ρ₀) / ρ₀',note:'b 为相对参考密度 ρ₀ 的浮力；线性化状态方程只适用于限定的状态范围。'},
{name:'垂向层结与混合层',desc:'表层混合层与跃层连接海气交换和内部海洋。稳定层结抑制垂向位移，但不能单独决定实际混合强度。',items:['混合层、季节跃层与永久温跃层','浮力频率 N 与静力稳定性','位密度、中性密度与等密度面'],formula:'N² = ∂b / ∂z',note:'z 向上；对可压缩海水的实际诊断应使用适当的位密度或热力学导数，避免将压力压缩效应误判为层结。'},
{name:'水团与海洋基本分布',desc:'水团通过形成条件获得温盐和示踪剂特征，随后在平流与混合中演化。T–S 图可帮助辨识水团，但相似温盐不一定意味着相同来源。',items:['温盐图与水团识别','表层、模态水、中层水与深底层水','通风、年龄与示踪剂'],links:['overturning','methods']},
{name:'地形、边界与时空尺度',desc:'海盆、陆架、海峡与海底粗糙度约束流动路径。比较空间与时间尺度，是选择方程近似、观测采样和数值分辨率的第一步。',items:['海盆、陆架坡折与海底地形','秒至千年、毫米至全球的过程尺度','外部与内部变形半径'],formula:'Ld ≈ c / |f|',note:'c 为相应模态的重力波相速；该近似适用于远离赤道的旋转尺度，赤道需使用 β 控制的尺度。'}]},
{id:'dynamics',name:'守恒方程与动力学框架',en:'GOVERNING DYNAMICS',color:'#3565a1',summary:'动量与连续性 · 守恒 · 平衡与尺度',intro:'用守恒律描述海洋，再依据旋转、层结和尺度选择近似。地转、静力和浅水模型都有适用边界。',topics:[
{name:'基本方程与边界条件',desc:'海洋流动由旋转坐标系中的动量方程、质量守恒、温盐输运和状态方程共同描述，且必须给定表面、海底和侧边界条件。',items:['旋转 Navier–Stokes 与连续性','温度、盐度及示踪剂输运','海表应力、浮力通量与底边界条件'],formula:'D𝐮/Dt + f 𝐤×𝐮 = −∇p/ρ₀ + b𝐤 + 𝐅\n∇·𝐮 = 0',note:'此处为局地 f 平面、Boussinesq 形式；𝐮 为三维速度，p 为去除参考静水压力后的扰动压力，𝐅 包括摩擦等作用。'},
{name:'近似、无量纲数与尺度分析',desc:'尺度分析决定哪些项可以忽略。静力近似适合垂向加速度较小的流动；非静力过程、破碎内波及小尺度对流可能需要保留垂向动量。',items:['Boussinesq、静力与浅水近似','Rossby、Froude、Reynolds、Richardson 数','f 平面、β 平面与球面几何'],formula:'Ro = U/(|f|L)；Fr = U/(NH)\nRe = UL/ν；Ri = N²/(∂u/∂z)²',note:'这些是常见尺度定义；Fr 的选取随内外重力波模型而变。赤道附近不能直接套用基于非零 f 的地转尺度。'},
{name:'主要力学平衡',desc:'地转平衡连接水平压力梯度与流速；热成风联系密度梯度与地转流垂向切变。实际海洋常含风应力、加速度和摩擦导致的非地转分量。',items:['静力平衡与地转平衡','热成风与斜压结构','梯度风、摩擦与非地转运动'],formula:'∂p_total/∂z = −ρg\nf 𝐤×𝐮g = −∇h p/ρ₀\nf ∂𝐮g/∂z = −𝐤×∇h b',note:'z 向上；热成风式基于静力、地转和 Boussinesq 近似，且 f ≠ 0。'},
{name:'涡度、位涡与能量收支',desc:'位涡将旋转与层结联系起来，能量预算连接外部输入、可用位能、动能和耗散。位涡守恒需要无摩擦、绝热等条件。',items:['相对涡度、行星涡度与涡度预算','Ertel 位涡与位涡守恒条件','动能、可用位能及能量转换'],formula:'q = (ω + f𝐤)·∇b\n浅水位涡：qSW = (ζ + f)/h',note:'第一式为 Boussinesq 浮力形式的 Ertel 位涡；浅水式是单层近似，两者不可直接混用。',links:['mesoscale','mixing']}]},
{id:'waves',name:'海洋波动与潮汐',en:'WAVES & TIDES',color:'#5a66af',summary:'表面波 · 内波 · 旋转波 · 天文潮汐',intro:'波动传播信息与能量，在不同恢复力作用下形成表面重力波、内波、惯性波和 Rossby 波，并与流、地形及湍流相互作用。',topics:[
{name:'表面重力波与风浪',desc:'风浪和涌浪受重力恢复力控制；毛细力在极短尺度显著。波浪的非线性、破碎和波流耦合改变近表层输运与海岸动力。',items:['风浪、涌浪与波谱','频散、相速与群速','波浪破碎、Stokes 漂移与波流耦合'],formula:'ω² = gk tanh(kH)',note:'线性、无背景流的表面重力波频散关系；忽略毛细力，H 为均匀水深。',links:['coastal','mixing']},
{name:'内重力波与近惯性运动',desc:'内部层结提供恢复力，风、潮流与地形可激发内波；近惯性能量可进入内部海洋并通过波相互作用和破碎参与混合。',items:['内波模态与内潮','近惯性波与风能输入','传播、反射、临界层与破碎'],formula:'ω² = (N²kh² + f²m²)/(kh² + m²)',note:'均匀 N、局地 f 平面、线性非静力内波；频率通常介于 |f| 与 N 之间。',links:['mixing']},
{name:'Kelvin、Rossby 与赤道波',desc:'海岸或赤道可俘获 Kelvin 波；行星涡度随纬度变化使 Rossby 波传播。赤道波导连接热带风场变化、温跃层调整与 ENSO。',items:['海岸与赤道 Kelvin 波','行星与地形 Rossby 波','赤道 Rossby 波与混合 Rossby–重力波'],formula:'ω = −βkx / (kx² + ky² + Ld⁻²)',note:'无平均流、均匀 β、单个斜压模态的线性 Rossby 波近似；β = ∂f/∂y。',links:['climate','wind']},
{name:'潮汐、潮流与潮能',desc:'太阳和月球引力产生周期性强迫，海盆几何与地形决定海潮响应；正压潮与斜压内潮之间的能量转换连接潮汐和深海混合。',items:['引潮势、主要分潮与调和分析','正压潮、潮流与海盆共振','内潮生成、耗散与潮致混合'],links:['coastal','mixing']}]},
{id:'wind',name:'风驱环流与海洋调整',en:'WIND-DRIVEN CIRCULATION',color:'#157c79',summary:'Ekman · Sverdrup · 边界流 · 赤道',intro:'风应力向海洋输入动量。Ekman 输运、涡度平衡、边界层与波动调整共同形成海盆尺度环流。',topics:[
{name:'Ekman 层与上升流',desc:'风应力和旋转在摩擦层内产生跨风向的积分输运，其辐散驱动垂向运动。海岸上升流的方向必须结合海岸位置、风向和半球判断。',items:['表面与底部 Ekman 层','Ekman 输运与抽吸','沿岸和赤道上升流'],formula:'𝐌E = (τy, −τx)/(ρ₀f)\nwE = ∂Mx/∂x + ∂My/∂y',note:'x 向东、y 向北、z 向上；表面 Ekman 层，远离赤道。wE 为层底抽吸速度，忽略海表垂向运动。',links:['coastal']},
{name:'海盆内部涡度平衡',desc:'在宽阔、缓慢变化的海盆内部，风应力旋度可与经向输运引起的行星涡度变化平衡，形成 Sverdrup 环流骨架。',items:['风应力旋度与 Sverdrup 平衡','副热带、副极地环流','Stommel 与 Munk 理论'],formula:'βV = (∇×τ)z / ρ₀',note:'V 为深度积分的经向速度；稳态、弱非线性海盆内部近似，边界流、地形或强惯性区域可能不适用。'},
{name:'西边界强化与强流系统',desc:'β 效应、摩擦和惯性使海盆边界调整呈现东西不对称，形成窄而强的西边界流。实际强流还涉及分离、回流和涡旋。',items:['西边界强化机制','湾流、黑潮及其延伸体','边界流分离、回流与涡旋交换'],links:['mesoscale']},

const $=id=>document.getElementById(id);const expanded=new Set(['root']);let selected=root,scale=1,tx=0,ty=0,visible=[],searchHits=new Set();const dims=[{w:226,h:148},{w:254,h:112},{w:234,h:60},{w:224,h:46}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function height(n){const d=dims[n.level];if(!expanded.has(n.id)||!n.children.length)return d.h;return Math.max(d.h,n.children.reduce((a,c)=>a+height(c),0)+(n.children.length-1)*20)}
function layout(){visible=[root];root.x=-dims[0].w/2;root.y=-dims[0].h/2;[-1,1].forEach(side=>{const rows=root.children.filter(b=>b.side===side);const total=rows.reduce((a,n)=>a+height(n),0)+(rows.length-1)*22;let y=-total/2;rows.forEach(n=>{place(n,y+height(n)/2,side);y+=height(n)+22})});draw()}
function place(n,cy,side){const d=dims[n.level];const distance=[0,360,664,954][n.level];n.x=side>0?distance-d.w/2:-distance-d.w/2;n.y=cy-d.h/2;visible.push(n);if(expanded.has(n.id)){let y=cy-(n.children.reduce((a,c)=>a+height(c),0)+(n.children.length-1)*20)/2;n.children.forEach(c=>{place(c,y+height(c)/2,side);y+=height(c)+20})}}
function draw(){const lines=[];const nodes=[];visible.forEach(n=>{const d=dims[n.level];if(n.parent){const p=n.parent,pd=dims[p.level],s=n.side;const sx=p.x+(s>0?pd.w:0),sy=p.y+pd.h/2,ex=n.x+(s>0?0:d.w),ey=n.y+d.h/2,mx=(sx+ex)/2;lines.push('<path d="M '+sx+' '+sy+' C '+mx+' '+sy+', '+mx+' '+ey+', '+ex+' '+ey+'" fill="none" stroke="'+n.color+'" stroke-opacity=".5" stroke-width="'+(n.level===1?2:1.3)+'"/>')}
let subtitle=n.level===0?'海水状态 · 运动 · 能量<br>从局地过程到全球气候':n.level===1?esc(n.summary):'';const cls=n.level===0?'root':n.level===1?'branch':n.level===2?'topic':'leaf';nodes.push('<div class="node '+cls+(n.side<0?' left':'')+(n.id===selected.id?' selected':'')+(searchHits.has(n.id)?' hit':'')+'" data-id="'+n.id+'" style="left:'+n.x+'px;top:'+n.y+'px;width:'+d.w+'px;height:'+d.h+'px;--branch:'+n.color+'"><button class="node-main" data-select="'+n.id+'"'+(n.id===selected.id?' aria-current="true"':'')+'>'+(n.level===1?'<span class="node-code">'+String(n.order).padStart(2,'0')+' / '+esc(n.en)+'</span>':'')+'<span class="node-title">'+esc(n.name)+'</span>'+(subtitle?'<span class="node-sub">'+subtitle+'</span>':'')+'</button>'+(n.children.length&&n.level>0?'<button class="toggle" data-toggle="'+n.id+'" aria-label="'+(expanded.has(n.id)?'收起':'展开')+esc(n.name)+'" aria-expanded="'+expanded.has(n.id)+'">'+(expanded.has(n.id)?'−':'+')+'</button>':'')+'</div>')});$('wires').innerHTML=lines.join('');$('nodes').innerHTML=nodes.join('');transform()}
function transform(){ $('world').style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';$('zoomlabel').textContent=Math.round(scale*100)+'%'}
function bounds(arr){return{x0:Math.min(...arr.map(n=>n.x)),x1:Math.max(...arr.map(n=>n.x+dims[n.level].w)),y0:Math.min(...arr.map(n=>n.y)),y1:Math.max(...arr.map(n=>n.y+dims[n.level].h))}}
function fit(arr=visible){const b=bounds(arr),w=$('viewport').clientWidth,h=$('viewport').clientHeight;scale=Math.max(.12,Math.min(1.25,(w-80)/(b.x1-b.x0),(h-100)/(b.y1-b.y0)));tx=w/2-(b.x0+b.x1)/2*scale;ty=h/2-(b.y0+b.y1)/2*scale;transform()}
function center(n){const d=dims[n.level];scale=Math.max(.75,Math.min(scale,1.2));tx=$('viewport').clientWidth/2-(n.x+d.w/2)*scale;ty=$('viewport').clientHeight/2-(n.y+d.h/2)*scale;transform()}
function zoom(factor,x=$('viewport').clientWidth/2,y=$('viewport').clientHeight/2){const next=Math.max(.12,Math.min(2.2,scale*factor)),ratio=next/scale;tx=x-(x-tx)*ratio;ty=y-(y-ty)*ratio;scale=next;transform()}
function setStatus(s){$('status').textContent=s}
function showPanel(){ $('workspace').classList.remove('panel-hidden');$('panel').setAttribute('aria-pressed','true')}
function select(n,recenter=false){selected=n;showPanel();renderDetail(n);draw();if(recenter)requestAnimationFrame(()=>center(n));setStatus(path(n).map(a=>a.name).join(' / '))}
function path(n){const r=[];while(n){r.unshift(n);n=n.parent}return r}
function detailButton(n){return '<button class="detail-item" data-jump="'+n.id+'"><strong>'+esc(n.name)+'</strong>'+(n.summary||n.desc?'<span>'+esc(n.summary||n.desc)+'</span>':'')+'</button>'}
function renderDetail(n){const p=n.level===3?n.parent:n;const links=p.links||[];let html='<div class="detail-kicker">'+(n.level===0?'KNOWLEDGE FRAMEWORK':esc(path(n).slice(1,-1).map(a=>a.name).join(' / ')||'核心领域'))+'</div><h2>'+esc(n.name)+'</h2>';
if(n.level===3)html+='<p>属于“'+esc(p.name)+'”。'+esc(p.desc||'')+'</p>';else html+='<p>'+esc(n.desc||n.intro||'')+'</p>';
if(n.level===0){html+='<div class="formula">外部强迫：风 · 热量 · 淡水 · 潮汐<br>↓<br>动力响应：波动 · 环流 · 涡旋<br>↓<br>传递与耗散：湍流 · 混合<br>↓<br>结果与反馈：热盐再分布 · 气候</div><h3>十个相互联系的领域</h3>'+n.children.map(detailButton).join('')+'<h3>如何使用</h3><p>点击节点阅读解释；点击圆形 ＋ 逐级展开。主干总览适合建立全局认识，二级全景适合浏览主题。搜索可定位到更细的概念。</p>'}
else if(n.level===1){html+='<h3>核心主题</h3>'+n.children.map(detailButton).join('')+'<h3>展开脑图</h3><button data-expand="'+n.id+'">'+(expanded.has(n.id)?'收起此分支':'展开此分支')+'</button>'}
else{html+='<h3>关键概念</h3><ul>'+p.items.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>';if(p.formula)html+='<h3>代表性关系</h3><div class="formula">'+esc(p.formula)+'</div>';if(p.note)html+='<div class="formula-note">'+esc(p.note)+'</div>';if(n.level===2)html+='<h3>展开概念</h3><button data-expand="'+n.id+'">'+(expanded.has(n.id)?'收起概念':'展开三个概念')+'</button>'}
if(links.length)html+='<h3>相关领域</h3>'+links.map(id=>'<button class="crosslink" data-jump="'+id+'">'+esc(index.get(id).name)+' ↗</button>').join('');$('detail').innerHTML=html;$('sidebar').scrollTop=0}
function toggle(id){const n=index.get(id);if(expanded.has(id))expanded.delete(id);else expanded.add(id);layout();const sub=visible.filter(v=>path(v).some(p=>p.id===id));fit([n.parent,...sub]);if(selected.id===id)renderDetail(selected);$('overview').classList.remove('active');$('level2').classList.remove('active');setStatus(n.name+' · '+(expanded.has(id)?'已展开':'已收起'))}
function reveal(n){path(n).slice(0,-1).forEach(a=>expanded.add(a.id));layout();select(n,true)}
function overview(){expanded.clear();expanded.add('root');searchHits.clear();$('search').value='';layout();fit();$('overview').classList.add('active');$('level2').classList.remove('active');setStatus('10 个主分支 · '+(index.size-1)+' 个知识节点 · 点击主分支开始探索')}
function study(){showPanel();$('detail').innerHTML='<div class="detail-kicker">A PATH THROUGH THE OCEAN</div><h2>推荐学习路线</h2><p>按机制逐步推进，再用一个研究问题把理论、观测和模型连接起来。各分支并非严格串行，波动和环流可以交叉学习。</p><div class="route"><div><strong>起点 / 数理与流体基础</strong><span>微积分、矢量分析、微分方程、力学、热力学、流体力学与基本统计。</span></div><div><strong>第一步 / 状态与守恒</strong><span>海水温盐密度、层结 → 旋转流体方程 → 尺度分析与平衡。</span></div><div><strong>第二步 / 经典动力过程</strong><span>地转与热成风 → Ekman 与风驱环流 → 波动与潮汐 → 浮力和翻转。</span></div><div><strong>第三步 / 跨尺度与边界</strong><span>不稳定和涡旋 → 湍流混合 → 陆架、近岸与河口。</span></div><div><strong>第四步 / 地球系统与研究</strong><span>海气冰耦合与气候 → 观测分析 → 数值试验、同化与独立验证。</span></div></div><h3>研究闭环</h3><div class="formula">提出可检验的问题<br>→ 选择尺度与动力假设<br>→ 设计观测或理想化试验<br>→ 计算收支、诊断机制<br>→ 检验误差与竞争性解释</div><h3>教材与标准入口</h3><ul><li>Talley et al. — Descriptive Physical Oceanography</li><li>Stewart — Introduction to Physical Oceanography</li><li>Cushman-Roisin & Beckers — Introduction to Geophysical Fluid Dynamics</li><li>Vallis — Atmospheric and Oceanic Fluid Dynamics</li><li>Gill — Atmosphere–Ocean Dynamics</li><li>TEOS-10 — 海水热力学国际标准</li></ul><h3>一个贯穿练习</h3><p>以“沿岸上升流为何出现、如何改变热量输运”为题，连接风应力 → Ekman 输运 → 沿岸层结和锋面 → 涡旋交换 → 温度收支，再用风场、SST 与流速观测检验。</p>';setStatus('学习路线 · 从基础到机制，再到观测与模型的研究闭环');$('sidebar').scrollTop=0}
function search(){const q=$('search').value.trim().toLowerCase();if(!q){searchHits.clear();draw();renderDetail(selected);setStatus('输入关键词可检索主题、概念和解释');return}const results=[...index.values()].filter(n=>[n.name,n.en,n.desc,n.intro,n.summary,n.note,n.formula].filter(Boolean).join(' ').toLowerCase().includes(q));searchHits=new Set(results.map(n=>n.id));draw();showPanel();$('detail').innerHTML='<div class="detail-kicker">SEARCH THE KNOWLEDGE ATLAS</div><h2>搜索结果</h2><p>“'+esc($('search').value.trim())+'” · '+results.length+' 个匹配节点</p>'+(results.length?results.map(n=>'<button class="detail-item" data-jump="'+n.id+'"><strong>'+esc(n.name)+'</strong><span>'+esc(path(n).slice(0,-1).map(a=>a.name).join(' / '))+'</span></button>').join(''):'<p>试试更短的关键词，如“涡”“地转”“内波”“热量”或“ENSO”。</p>');$('sidebar').scrollTop=0;setStatus('搜索到 '+results.length+' 个匹配节点；点击结果定位到脑图')}
$('nodes').addEventListener('click',e=>{const t=e.target.closest('[data-toggle]');if(t){toggle(t.dataset.toggle);return}const s=e.target.closest('[data-select]');if(s)select(index.get(s.dataset.select))});
$('detail').addEventListener('click',e=>{const t=e.target.closest('[data-jump]');if(t)reveal(index.get(t.dataset.jump));const ex=e.target.closest('[data-expand]');if(ex)toggle(ex.dataset.expand)});
$('overview').onclick=overview;$('level2').onclick=()=>{expanded.clear();expanded.add('root');branches.forEach(b=>expanded.add(b.id));layout();fit();$('overview').classList.remove('active');$('level2').classList.add('active');setStatus('二级全景 · 滚轮放大后可阅读各主题；点击节点查看解释')};$('fit').onclick=()=>fit();$('zoomin').onclick=()=>zoom(1.2);$('zoomout').onclick=()=>zoom(1/1.2);$('study').onclick=study;$('panel').onclick=()=>{const hide=$('workspace').classList.toggle('panel-hidden');$('panel').setAttribute('aria-pressed',!hide);requestAnimationFrame(()=>fit())};$('searchform').onsubmit=e=>{e.preventDefault();search()};$('search').addEventListener('input',()=>{if(!$('search').value)search()});
function theme(dark){document.body.classList.toggle('dark',dark);$('theme').textContent=dark?'浅色':'深色';try{localStorage.setItem('ocean-theme',dark?'dark':'light')}catch(e){}}
try{theme(localStorage.getItem('ocean-theme')==='dark')}catch(e){}$('theme').onclick=()=>theme(!document.body.classList.contains('dark'));
const vp=$('viewport');let drag=null;vp.addEventListener('pointerdown',e=>{if(e.target.closest('button')||e.button!==0)return;drag={x:e.clientX,y:e.clientY,tx,ty};vp.setPointerCapture(e.pointerId);vp.classList.add('dragging')});vp.addEventListener('pointermove',e=>{if(drag){tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;transform()}});function endDrag(){drag=null;vp.classList.remove('dragging')}vp.addEventListener('pointerup',endDrag);vp.addEventListener('pointercancel',endDrag);vp.addEventListener('wheel',e=>{e.preventDefault();const rect=vp.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0015),e.clientX-rect.left,e.clientY-rect.top)},{passive:false});
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='/'){e.preventDefault();$('search').focus()}if(e.key==='+'||e.key==='=')zoom(1.2);if(e.key==='-')zoom(1/1.2);if(e.key==='0')fit()});
let lastWidth=0,lastHeight=0;new ResizeObserver(()=>{const w=vp.clientWidth,h=vp.clientHeight;if(Math.abs(w-lastWidth)>2||Math.abs(h-lastHeight)>2){lastWidth=w;lastHeight=h;fit()}}).observe(vp);
$('print').innerHTML='<h2>知识提纲</h2><p>'+esc(root.desc)+'</p>'+branches.map(b=>'<section><h2>'+b.order+'. '+esc(b.name)+'</h2><p>'+esc(b.intro)+'</p>'+b.topics.map(t=>'<h3>'+esc(t.name)+'</h3><p>'+esc(t.desc)+'</p><ul>'+t.items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>'+(t.formula?'<p>'+esc(t.formula).replace(/\n/g,'<br>')+'</p>':'')+(t.note?'<p>'+esc(t.note)+'</p>':'')).join('')+'</section>').join('');
layout();renderDetail(root);requestAnimationFrame(()=>{fit();setStatus('10 个主分支 · '+(index.size-1)+' 个知识节点 · 点击主分支开始探索')});
</script>
</body>
</html>
